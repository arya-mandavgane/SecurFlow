services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: securflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-securflow_db}
      POSTGRES_USER: ${DB_USER:-securflow_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-securflow_secure_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init-pgvector.sql:/docker-entrypoint-initdb.d/init-pgvector.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-securflow_user} -d ${DB_NAME:-securflow_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: securflow-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securflow-backend
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DB_NAME=${DB_NAME:-securflow_db}
      - DB_USER=${DB_USER:-securflow_user}
      - DB_PASSWORD=${DB_PASSWORD:-securflow_secure_pass_2026}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - AI_SERVICE_URL=http://ai-service:8001
      - OCR_SERVICE_URL=http://ocr-service:8002
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securflow-celery-worker
    restart: unless-stopped
    command: celery -A securflow_core worker -l INFO
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    environment:
      - DB_NAME=${DB_NAME:-securflow_db}
      - DB_USER=${DB_USER:-securflow_user}
      - DB_PASSWORD=${DB_PASSWORD:-securflow_secure_pass_2026}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OCR_SERVICE_URL=http://ocr-service:8002
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  celery-beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: securflow-celery-beat
    restart: unless-stopped
    command: celery -A securflow_core beat -l INFO
    volumes:
      - ./backend:/app
    environment:
      - DB_NAME=${DB_NAME:-securflow_db}
      - DB_USER=${DB_USER:-securflow_user}
      - DB_PASSWORD=${DB_PASSWORD:-securflow_secure_pass_2026}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
    container_name: securflow-ai-service
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${DB_NAME:-securflow_db}
      - DB_USER=${DB_USER:-securflow_user}
      - DB_PASSWORD=${DB_PASSWORD:-securflow_secure_pass_2026}
      - LLM_API_KEY=${LLM_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy

  ocr-service:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    container_name: securflow-ocr-service
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: securflow-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_AI_SERVICE_URL=http://localhost:8001
    depends_on:
      - backend

volumes:
  postgres_data:
  backend_media:
